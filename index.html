<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SETORIALCONTAGEM_MEMBROS</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#8ed8ff,#d9f3ff);
}

.container{
    width:90%;
    max-width:380px;
    background:white;
    border-radius:20px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.logo{
    width:170px;
    margin-bottom:20px;
}

h1{
    font-size:22px;
    color:#005b96;
    margin-bottom:25px;
}

p{
    color:#555;
    margin-bottom:15px;
    font-size:16px;
}

input{
    width:100%;
    padding:15px;
    border-radius:10px;
    border:1px solid #bbb;
    font-size:20px;
    text-align:center;
    letter-spacing:3px;
    margin-bottom:20px;
    color:#000;
    background:#fff;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0077c8;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#005b96;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#777;
}
</style>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>
SETORIALCONTAGEM_MEMBROS
</h1>

<p>
Digite o código de acesso
</p>

<input 
type="text"
id="voucher"
name="voucher"
placeholder="00000-00000"
maxlength="11"
autocomplete="off"
inputmode="numeric">

<button onclick="conectar()">
CONECTAR
</button>

<div class="footer">
Igreja Pentecostal Deus é Amor
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg3-xB-X0ZbpkGa6Yr_Lr1JTVG7ZoWfg",
  authDomain: "voucher-setorial-contagem.firebaseapp.com",
  projectId: "voucher-setorial-contagem",
  storageBucket: "voucher-setorial-contagem.firebasestorage.app",
  messagingSenderId: "269396418254",
  appId: "1:269396418254:web:ed94b6e717de49f543fa9f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.conectar = async function(){

    let codigo = document.getElementById("voucher").value;

    if(codigo.length !== 11){
        alert("Digite um código válido.");
        return;
    }

    const referencia = doc(db, "vouchers", codigo);

    const consulta = await getDoc(referencia);

    if(!consulta.exists()){
        alert("Voucher inválido.");
        return;
    }

    const dados = consulta.data();

    if(dados.status !== "disponivel"){
        alert("Voucher já utilizado.");
        return;
    }

    await updateDoc(referencia,{
        status:"usado",
        usadoEm:serverTimestamp()
    });

    alert("Acesso liberado!");

}
</script>


<script>

const campo = document.getElementById("voucher");

campo.addEventListener("input", function(){

let valor = campo.value.replace(/\D/g,'');

if(valor.length > 5){
valor = valor.substring(0,5)+"-"+valor.substring(5,10);
}

campo.value = valor;

});

// Aqui vamos colocar a validação com o banco de vouchers

alert("Validando código: "+codigo);

}

</script>

</body>
</html>
